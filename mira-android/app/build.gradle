plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mira.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.mira.companion"
        minSdk 29              // Android 10
        targetSdk 34
        versionCode 7
        versionName "2.5"

        ndk {
            // Android 10 phones are arm64; keep 32-bit ARM for older hardware.
            // Leaving all four ABIs in would double the download for no gain.
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            // Pin the runtime: Chaquopy defaults to 3.8, which is EOL and lacks
            // the modern stdlib behaviour MIRA is written against.
            version "3.11"

            // MIRA's brain is standard-library only, so no pip install runs at
            // build time. httpx / cryptography / edge-tts are optional and are
            // detected at runtime — the app degrades honestly without them.
            buildPython System.getenv("MIRA_BUILD_PYTHON") ?: "python3"
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv("MIRA_KEYSTORE") ?: "mira-release.jks"
            def ksFile = file(ks)
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("MIRA_STORE_PASS") ?: "mira123"
                keyAlias System.getenv("MIRA_KEY_ALIAS") ?: "mira"
                keyPassword System.getenv("MIRA_KEY_PASS") ?: "mira123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // keep the asset tree byte-for-byte; aapt2 would otherwise re-compress it
    androidResources {
        noCompress 'html', 'js', 'css', 'png', 'json'
    }
}

dependencies {
    // Intentionally empty — platform APIs only (WebView, TextToSpeech,
    // RecognizerIntent). Keeps the APK small enough for a 4 GB Android 10 phone.
}
