<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIRA</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-user-select:none;user-select:none}
  .shell{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;gap:6px}
  .glow{position:absolute;inset:0;border-radius:26px;
    background:radial-gradient(120% 70% at 50% 20%,rgba(167,139,250,.28),rgba(10,4,20,0) 62%);
    pointer-events:none}
  #mira3dWrap{position:absolute;inset:0;bottom:34px}
  #mira3dWrap canvas{width:100%;height:100%;display:block}
  .bubble{position:relative;z-index:3;max-width:96%;margin:0 4px 4px;
    padding:7px 10px;border-radius:12px;font-size:11px;line-height:1.35;
    color:#f3ecff;background:rgba(18,8,32,.78);
    border:1px solid rgba(167,139,250,.35);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    display:none;word-break:break-word}
  .bubble.show{display:block}
  .close{position:absolute;top:2px;right:2px;z-index:5;width:22px;height:22px;
    border-radius:50%;border:1px solid rgba(255,255,255,.22);
    background:rgba(0,0,0,.35);color:#ddd;font-size:12px;line-height:20px;
    text-align:center;cursor:pointer}
  .dot{position:absolute;top:6px;left:8px;z-index:5;width:7px;height:7px;border-radius:50%;
    background:#38bdf8;box-shadow:0 0 10px #38bdf8;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
  <div class="shell">
    <div class="glow"></div>
    <div class="dot" id="dot"></div>
    <div class="close" id="close">✕</div>
    <div id="mira3dWrap"><canvas id="mira3d"></canvas></div>
    <div class="bubble" id="bubble">Haan?</div>
  </div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
