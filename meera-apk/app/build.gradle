plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meera.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.meera.assistant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ks = System.getenv("MEERA_KEYSTORE") ?: "meera-release.jks"
            def ksFile = file(ks)
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("MEERA_STORE_PASS") ?: "meera123"
                keyAlias System.getenv("MEERA_KEY_ALIAS") ?: "meera"
                keyPassword System.getenv("MEERA_KEY_PASS") ?: "meera123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // keep the asset tree byte-for-byte; aapt2 would otherwise re-compress it
    androidResources {
        noCompress 'html', 'js', 'css', 'png', 'json'
    }
}

dependencies {
    // Intentionally empty: Meera's Android shell uses only platform APIs
    // (android.webkit.WebView, android.speech.tts, RecognizerIntent), so the
    // APK stays tiny and the build needs no third-party downloads.
}
