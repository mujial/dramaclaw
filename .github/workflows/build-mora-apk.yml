name: Build Mora AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/317939ed-dramaclaw
    paths:
      - 'mora-ai/**'
      - '.github/workflows/build-mora-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK Platform 36
        run: |
          SDK_MGR=$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager 2>/dev/null | head -n 1)
          yes | "$SDK_MGR" --licenses > /dev/null || true
          yes | "$SDK_MGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies and sync Capacitor Android
        working-directory: mora-ai
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Debug APK
        working-directory: mora-ai/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Report Gradle Failure Details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$({ grep -n -E "error:|FAILURE:|What went wrong:|Caused by:" /tmp/gradle-build.log | head -n 40; echo "---"; grep -n -C 2 "error:" /tmp/gradle-build.log | head -n 80; } | python3 -c 'import json,sys; print(json.dumps({"body": "```text\n" + sys.stdin.read()[-60000:] + "\n```"}))')
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$BODY" || true

      - name: Stage APK in mora-ai/release
        run: |
          mkdir -p mora-ai/release
          cp mora-ai/android/app/build/outputs/apk/debug/app-debug.apk mora-ai/release/MIRA-AI-Personal-Assistant.apk
          ls -lh mora-ai/release/MIRA-AI-Personal-Assistant.apk

      - name: Commit APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mora-ai/release/MIRA-AI-Personal-Assistant.apk
          git commit -s -m "chore(mira-ai): attach compiled MIRA-AI-Personal-Assistant.apk [skip ci]"
          git push origin HEAD:arena/317939ed-dramaclaw

      - name: Upload MIRA AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIRA-AI-Personal-Assistant-APK
          path: mora-ai/release/MIRA-AI-Personal-Assistant.apk
          retention-days: 30
